# Temporary deployment: Render default *.onrender.com URLs, no custom domains.
# Crossing those two hosts is cross-SITE (onrender.com is on the Public Suffix
# List), so the core sets SameSite=None; Secure cookies (COOKIE_CROSS_SITE=1)
# and an explicit CORS allow-list (CORS_ORIGINS).
databases:
  - name: microbalance-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: microbalance-core
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/damiTheCoder/microbalance-v1
    branch: main
    rootDir: microbalance-core
    healthCheckPath: /api/health
    # Free tier has no preDeployCommand, so the schema push lives here. It runs
    # once per deploy, and only after generate + build have succeeded.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm exec prisma generate && corepack pnpm exec prisma db push && corepack pnpm run build && cp -R src/landing dist/src/landing
    startCommand: node dist/src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: microbalance-db
          property: connectionString
      # prisma/schema.prisma declares directUrl for migrations/DDL.
      - key: DIRECT_URL
        fromDatabase:
          name: microbalance-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      # Third-party cookies: the UI calls this API from another site.
      - key: COOKIE_CROSS_SITE
        value: "1"
      - key: AGENT_COMPANY_ID
        value: default
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AGENT_API_TOKEN
        generateValue: true
      # Filled in once Render assigns the URLs (see CORS_ORIGINS too).
      - key: BETTER_AUTH_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AGENT_USER_ID
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false

  - type: web
    name: microbalance-ui
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/damiTheCoder/deepseek-harness
    branch: main
    healthCheckPath: /
    # build:web produces apps/web/dist; the dsh CLI itself runs from TS sources.
    # apply-core-url rewrites the committed client bundle to this core's URL.
    buildCommand: corepack pnpm install --no-frozen-lockfile && node deploy/apply-core-url.mjs
    startCommand: corepack pnpm dsh --profile web --patch ./deploy/cordis.patch.yml --host 0.0.0.0 --port $PORT --no-open
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      # The repo's postinstall installs git hooks; its installer exits early in
      # CI, and Render's checkout is not a normal worktree.
      - key: CI
        value: "true"
      # 512 MB free-tier instance: tsx compiles the workspace at boot, and V8's
      # default heap targets a larger machine, so the process is OOM-killed
      # before it binds the port.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: MICROBALANCE_CORE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
