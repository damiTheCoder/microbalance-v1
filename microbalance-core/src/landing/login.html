<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — MicroBalance</title>
<meta name="description" content="Sign in to MicroBalance, the AI-powered financial OS for Nigerian businesses." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/png" href="/logo.png" />
<style>
  :root {
    --ink: #111111;
    --muted: #6b7280;
    --soft: #9ca3af;
    --line: #e5e7eb;
    --bg: #ffffff;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
  }

  .login-shell {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.045em;
    color: var(--ink);
  }

  .brand img {
    display: block;
    width: 72px;
    height: 72px;
    border-radius: 14px;
    object-fit: contain;
  }

  h1 {
    margin: 40px 0 0;
    font-size: 34px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.04em;
  }

  .lede {
    margin: 12px 0 0;
    max-width: 340px;
    font-size: 16px;
    color: var(--muted);
  }

  .google-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 40px;
    border: 1px solid #E5E7EB;
    padding: 16px 32px;
    border-radius: 999px;
    background: #ffffff;
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  .google-button:hover {
    background: #f9fafb;
    border-color: #d1d5db;
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -14px rgba(17, 17, 17, 0.35);
  }

  .google-button:active { transform: translateY(0); }

  .google-button:disabled { opacity: 0.65; cursor: progress; }

  .google-button svg { width: 20px; height: 20px; flex: none; }

  .error {
    display: none;
    margin-top: 16px;
    max-width: 360px;
    font-size: 14px;
    color: #b91c1c;
  }

  .error.visible { display: block; }

  .terms {
    margin: 44px 0 0;
    font-size: 12px;
    line-height: 1.6;
    color: var(--soft);
  }

  .terms a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  @media (max-width: 480px) {
    body { padding: 24px; }
    .brand { font-size: 26px; }
    .brand img { width: 60px; height: 60px; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
  <main class="login-shell">
    <div class="brand">
      <img src="/logo.png" width="72" height="72" alt="MicroBalance" draggable="false" />
    </div>

    <h1>Sign in to MicroBalance</h1>
    <p class="lede">The AI-powered financial OS for Nigerian businesses.</p>

    <button class="google-button" type="button" id="google-signin">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.47a5.53 5.53 0 0 1-2.4 3.63v3.02h3.86c2.26-2.09 3.56-5.17 3.56-8.89Z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.95-2.91l-3.86-3.02c-1.08.72-2.45 1.16-4.09 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09A12 12 0 0 0 12 24Z"/>
        <path fill="#FBBC05" d="M5.27 14.27a7.2 7.2 0 0 1 0-4.54V6.64H1.29a12 12 0 0 0 0 10.72l3.98-3.09Z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.29 6.64l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75Z"/>
      </svg>
      <span id="google-label">Continue with Google</span>
    </button>

    <p class="error" id="login-error" role="alert"></p>

    <p class="terms">By continuing, you agree to our <a href="/#pricing">Terms</a> &amp; <a href="/#pricing">Privacy Policy</a>.</p>
  </main>

  <script>
    (function () {
      var button = document.getElementById('google-signin');
      var label = document.getElementById('google-label');
      var error = document.getElementById('login-error');
      // The app origin. The server injects APP_URL; the :3080 default only
      // applies to local development, where the UI runs beside this core.
      var appUrl = '%APP_URL%';
      if (appUrl === '' || appUrl.indexOf('%APP') === 0) {
        appUrl = location.protocol + '//' + location.hostname + ':3080/';
      }

      function fail(message) {
        error.textContent = message;
        error.classList.add('visible');
      }

      button.addEventListener('click', function () {
        button.disabled = true;
        label.textContent = 'Connecting…';
        error.classList.remove('visible');

        fetch('/api/auth/sign-in/social', {
          method: 'POST',
          credentials: 'include',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            provider: 'google',
            callbackURL: appUrl,
            errorCallbackURL: location.href,
          }),
        })
          .then(function (response) {
            // The API can answer 500 with an empty body (e.g. the database is
            // unreachable). Calling response.json() on that throws
            // "Unexpected end of JSON input" and hides the real failure, so
            // read the body as text and parse it only when there is one.
            return response.text().then(function (raw) {
              var body = {};
              if (raw) {
                try {
                  body = JSON.parse(raw);
                } catch (_parseError) {
                  body = {};
                }
              }
              if (!body.url) {
                throw new Error(
                  body.message ||
                    body.error ||
                    (response.ok
                      ? 'Could not start Google sign-in.'
                      : 'Sign-in is unavailable right now (' + response.status + '). Please try again.'),
                );
              }
              return body.url;
            });
          })
          .then(function (url) { window.location.assign(url); })
          .catch(function (cause) {
            button.disabled = false;
            label.textContent = 'Continue with Google';
            fail(cause && cause.message ? cause.message : 'Could not start Google sign-in.');
          });
      });
    })();
  </script>
</body>
</html>
